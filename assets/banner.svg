<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a16" />
      <stop offset="50%" stop-color="#120e2e" />
      <stop offset="100%" stop-color="#05050f" />
    </linearGradient>

    <!-- Animated Mesh Gradients -->
    <radialGradient id="mesh1" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="mesh2" cx="80%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="mesh3" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <!-- Text Glow Filter -->
    <filter id="titleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Animated Shimmer Gradient for Title -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff">
        <animate attributeName="stop-color" values="#ffffff;#a5b4fc;#38bdf8;#ffffff" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#c084fc">
        <animate attributeName="stop-color" values="#c084fc;#f472b6;#818cf8;#c084fc" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#ffffff;#f472b6;#38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Flowing Wave Gradients -->
    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="waveGrad2" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.15" />
    </linearGradient>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 900;
      font-size: 56px;
      letter-spacing: -1.5px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 19px;
      fill: #cbd5e1;
      letter-spacing: 0.5px;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #e0e7ff;
      letter-spacing: 0.8px;
    }
  </style>

  <!-- Deep Canvas Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- DYNAMIC BACKGROUND LAYER: Animated Ambient Glow Orbs -->
  <g id="dynamic-ambient-background">
    <!-- Pulsing Cyan Orb -->
    <circle cx="250" cy="180" r="180" fill="url(#mesh1)">
      <animate attributeName="r" values="160;210;160" dur="7s" repeatCount="indefinite" />
      <animate attributeName="cx" values="230;270;230" dur="9s" repeatCount="indefinite" />
    </circle>
    <!-- Pulsing Pink/Magenta Orb -->
    <circle cx="950" cy="160" r="210" fill="url(#mesh2)">
      <animate attributeName="r" values="190;240;190" dur="8s" repeatCount="indefinite" />
      <animate attributeName="cy" values="140;180;140" dur="10s" repeatCount="indefinite" />
    </circle>
    <!-- Central Cyan Pulse -->
    <circle cx="600" cy="180" r="150" fill="url(#mesh3)">
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="6s" repeatCount="indefinite" />
    </circle>

    <!-- Animated Flowing Waves at the bottom (Subtle & strictly background) -->
    <path fill="url(#waveGrad1)" d="M0,290 C300,240 600,340 900,280 C1050,250 1150,300 1200,310 L1200,360 L0,360 Z">
      <animate attributeName="d"
        values="M0,290 C300,240 600,340 900,280 C1050,250 1150,300 1200,310 L1200,360 L0,360 Z;
                M0,300 C350,330 650,260 950,310 C1080,330 1160,280 1200,290 L1200,360 L0,360 Z;
                M0,290 C300,240 600,340 900,280 C1050,250 1150,300 1200,310 L1200,360 L0,360 Z"
        dur="10s" repeatCount="indefinite" />
    </path>
    <path fill="url(#waveGrad2)" d="M0,320 C250,350 550,290 850,330 C1000,350 1120,310 1200,320 L1200,360 L0,360 Z">
      <animate attributeName="d"
        values="M0,320 C250,350 550,290 850,330 C1000,350 1120,310 1200,320 L1200,360 L0,360 Z;
                M0,310 C280,280 580,340 880,300 C1020,290 1140,330 1200,335 L1200,360 L0,360 Z;
                M0,320 C250,350 550,290 850,330 C1000,350 1120,310 1200,320 L1200,360 L0,360 Z"
        dur="12s" repeatCount="indefinite" />
    </path>

    <!-- Floating Sparkles / Generative Diffusion Particles -->
    <circle cx="150" cy="90" r="2.5" fill="#a5b4fc" opacity="0.6">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="3s" repeatCount="indefinite" />
      <animate attributeName="cy" values="90;82;90" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="380" cy="65" r="3" fill="#38bdf8" opacity="0.7">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="820" cy="80" r="2" fill="#f472b6" opacity="0.5">
      <animate attributeName="opacity" values="0.1;0.8;0.1" dur="3.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="1060" cy="110" r="3" fill="#c084fc" opacity="0.6">
      <animate attributeName="opacity" values="0.2;0.95;0.2" dur="4.5s" repeatCount="indefinite" />
      <animate attributeName="cy" values="110;100;110" dur="5s" repeatCount="indefinite" />
    </circle>
    <circle cx="1110" cy="230" r="2.5" fill="#38bdf8" opacity="0.4">
      <animate attributeName="opacity" values="0.1;0.8;0.1" dur="3.8s" repeatCount="indefinite" />
    </circle>
  </defs>

  <!-- FOREGROUND LAYER: Badges, Title, Subtitle (Guaranteed in front) -->
  <g id="foreground-content">
    <!-- Category Pill Tag -->
    <g transform="translate(480, 50)">
      <rect x="0" y="0" width="240" height="34" rx="17" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.7" />
      <circle cx="18" cy="17" r="5" fill="#10b981">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="32" y="22" class="badge-text">CURATED ECOSYSTEM 2026</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="150" text-anchor="middle" class="title" fill="url(#titleGrad)" filter="url(#titleGlow)">
      Awesome AI Image Generation
    </text>

    <!-- Subtitle -->
    <text x="600" y="200" text-anchor="middle" class="subtitle">
      State-of-the-Art Diffusion Models, Production SaaS Suites &amp; Open-Source Pipelines
    </text>

    <!-- Feature Tags -->
    <g transform="translate(600, 240)" text-anchor="middle">
      <!-- Tag 1: Text-to-Image -->
      <g transform="translate(-290, 0)">
        <rect x="0" y="0" width="130" height="30" rx="15" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <text x="65" y="19" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#94a3b8">🎨 Text-to-Image</text>
      </g>
      <!-- Tag 2: Diffusion & FLUX -->
      <g transform="translate(-140, 0)">
        <rect x="0" y="0" width="140" height="30" rx="15" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <text x="70" y="19" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#94a3b8">⚡ FLUX &amp; SDXL</text>
      </g>
      <!-- Tag 3: ComfyUI & WebUI -->
      <g transform="translate(15, 0)">
        <rect x="0" y="0" width="135" height="30" rx="15" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <text x="67" y="19" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#94a3b8">🧩 ComfyUI Nodes</text>
      </g>
      <!-- Tag 4: ControlNet & Inpainting -->
      <g transform="translate(165, 0)">
        <rect x="0" y="0" width="135" height="30" rx="15" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <text x="67" y="19" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#94a3b8">🎯 Control &amp; Inpaint</text>
      </g>
    </g>
  </g>

  <!-- Border Highlight -->
  <rect x="1" y="1" width="1198" height="358" rx="15" fill="none" stroke="#312e81" stroke-width="1.5" stroke-opacity="0.5" />
</svg>
